# =====================================================================
# m.terrabot.alphakonstruksi.id — aplikasi mobile.
#
# Berkasnya hasil `ng build --configuration=mobile`, disalin ke
# `/var/www/terrabot/frontend/frontend-mobile` — mengikuti susunan folder
# yang sudah dipakai, bukan folder baru di akar `/var/www`.
#
# Aplikasi desktop TIDAK diubah sama sekali; ia tetap dilayani blok server
# yang sudah ada.
#
# Keduanya berbicara ke API yang sama, jadi tidak ada blok API baru di sini.
# =====================================================================

server {
    listen 80;
    server_name m.terrabot.alphakonstruksi.id;

    # Certbot akan menambahkan blok 443 dan pengalihannya sendiri:
    #   certbot --nginx -d m.terrabot.alphakonstruksi.id

    root /var/www/terrabot/frontend/frontend-mobile;
    index index.html;

    # ---------------------------------------------------------------
    # Rute Angular ditangani di sisi peramban.
    #
    # Membuka `m.terrabot.../Persetujuan` langsung dari tautan atau dari
    # pintasan layar utama tidak menyentuh berkas bernama `Persetujuan`;
    # tanpa baris ini nginx membalas 404, dan yang mengalaminya menyimpulkan
    # aplikasinya rusak.
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------
    # Berkas berhash boleh disimpan lama; `index.html` TIDAK.
    #
    # Nama berkas mengikuti hash isinya, sehingga aman disimpan setahun.
    # `index.html` yang ikut tersimpan membuat ponsel terus memuat versi
    # lama sesudah deploy — dan versi lama itu mencari potongan berkas yang
    # sudah tidak ada.
    # ---------------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # Ukuran unggahan tidak diperlukan di sini: aplikasi mobile tidak
    # mengunggah apa pun. Dibiarkan kecil dengan sengaja.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
