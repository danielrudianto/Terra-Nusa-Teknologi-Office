# TerraBot — konfigurasi nginx.
#
# Hanya blok server FRONTEND yang bertambah; blok API, pengalihan HTTP, dan
# seluruh baris Certbot dibiarkan persis seperti aslinya.
#
# Cadangkan dulu sebelum menimpa:
#   sudo cp /etc/nginx/sites-enabled/terrabot ~/terrabot-nginx-backup.conf
#
# Setelah menimpa:
#   sudo nginx -t          # HARUS lolos sebelum reload
#   sudo systemctl reload nginx
#
# Bila `nginx -t` gagal, JANGAN reload — kembalikan cadangannya. Nginx yang
# sedang berjalan tidak terpengaruh sampai reload, sehingga situsnya tetap
# hidup selama pemeriksaan belum lolos.

server {
    server_name terrabot.alphakonstruksi.id;
    root /var/www/terrabot/frontend;
    index index.html;

    # -----------------------------------------------------------------------
    # CONTENT SECURITY POLICY — MODE LAPOR SAJA (Report-Only).
    # -----------------------------------------------------------------------
    #
    # `Content-Security-Policy-Report-Only` TIDAK MEMBLOKIR APA PUN. Peramban
    # hanya mencatat di konsol apa yang AKAN diblokir seandainya aturannya
    # ditegakkan. Aman dipasang di produksi hari ini juga; tidak ada satu pun
    # halaman yang dapat rusak karenanya.
    #
    # Dipasang dalam mode ini LEBIH DULU, dengan sengaja. CSP yang langsung
    # ditegakkan dan ternyata terlalu ketat tidak menghasilkan halaman galat
    # — ia menghasilkan halaman yang memuat separuh, tombol yang tidak
    # bereaksi, dan gambar yang tidak muncul, tanpa satu pun pesan di layar.
    # Yang menemukannya pengguna, bukan yang memasangnya.
    #
    # CARA MENALANYA:
    #
    #   1. Pasang ini, `sudo nginx -t`, lalu reload.
    #   2. Pakai aplikasinya seperti biasa selama beberapa hari — terutama
    #      halaman PDF, unduhan Excel, dan avatar.
    #   3. Buka DevTools -> Console. Tiap pelanggaran tercatat beserta
    #      arahan (`directive`) mana yang dilanggar dan alamat sumbernya.
    #   4. Bila BERSIH, ganti nama headernya menjadi
    #      `Content-Security-Policy` — barulah ia menegakkan.
    #
    # ALASAN TIAP ARAHAN:
    #
    #   default-src 'self'
    #       Bawaan untuk semua yang tidak disebut khusus.
    #
    #   script-src 'self'
    #       TANPA `unsafe-inline` dan TANPA `unsafe-eval`. Build produksi
    #       Angular tidak menaruh satu pun skrip sebaris di `index.html`
    #       (sudah diperiksa pada hasil build: dua `<script src=…>`, keduanya
    #       berkas tersendiri). Inilah arahan yang benar-benar menahan XSS —
    #       selebihnya pelengkap.
    #
    #   style-src 'self' 'unsafe-inline'
    #       `unsafe-inline` TERPAKSA, dan sebabnya dua: Angular menyisipkan
    #       satu blok `<style>` CSS kritis ke `index.html` saat build, dan
    #       Angular Material menulis gaya sebaris saat berjalan (animasi,
    #       posisi overlay). Tanpa ini tampilannya rusak total. Menghapusnya
    #       menuntut nonce per permintaan — mungkin, tetapi itu perubahan
    #       tersendiri, dan gaya sebaris bukan jalan masuk XSS yang sama
    #       berbahayanya dengan skrip sebaris.
    #
    #   img-src 'self' data: blob: https://services.terrabot.alphakonstruksi.id
    #       `data:` untuk avatar SVG yang dirakit di layar; `blob:` untuk
    #       pratinjau PDF dan gambar yang dirender ke canvas; host API untuk
    #       lampiran dan foto yang disajikannya.
    #
    #   font-src 'self'
    #       Montserrat disajikan sendiri dari `/media/`, bukan dari Google
    #       Fonts — sudah diperiksa pada hasil build.
    #
    #   connect-src 'self' https://services.terrabot.alphakonstruksi.id
    #       Seluruh permintaan API. Tidak ada tujuan lain.
    #
    #   worker-src 'self' blob:
    #       pdf.js memuat worker-nya dari `/assets/`, dan pada sebagian jalan
    #       mundur ia membuat worker dari `blob:`.
    #
    #   frame-src 'self' blob:
    #       Mencetak membuka bingkai tersembunyi berisi `blob:`.
    #
    #   frame-ancestors 'none'
    #       Situs lain tidak boleh membingkai aplikasi ini. Inilah penahan
    #       clickjacking, dan ia menggantikan `X-Frame-Options` yang lama.
    #
    #   base-uri 'self' / object-src 'none' / form-action 'self'
    #       Tiga penutup lubang klasik: `<base>` yang disuntikkan dapat
    #       membelokkan SELURUH alamat relatif; `<object>`/`<embed>` tidak
    #       dipakai sama sekali di sini; dan formulir tidak boleh mengirim
    #       ke luar.
    #
    # Ditulis SATU BARIS. Nginx tidak menyambung nilai header yang terpecah
    # beberapa baris, dan header yang terpotong di tengah justru menegakkan
    # aturan yang tidak dimaksudkan siapa pun.
    #
    # `always` supaya header ikut pada jawaban galat (404/500) juga.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://services.terrabot.alphakonstruksi.id; font-src 'self'; connect-src 'self' https://services.terrabot.alphakonstruksi.id; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # -----------------------------------------------------------------------
    # PERHATIAN pada `add_header` di nginx.
    #
    # `add_header` pada blok yang LEBIH DALAM MEMBATALKAN seluruh
    # `add_header` di blok induknya — bukan menambahinya. Beberapa blok
    # `location` di bawah memakai `add_header` untuk `Cache-Control`, dan
    # pada blok-blok itu header CSP ini TIDAK ikut terkirim.
    #
    # Dibiarkan begitu, dengan sengaja: yang dilayani blok-blok itu berkas
    # statis (aset berhash, i18n, `index.html`), dan CSP hanya berlaku pada
    # dokumen HTML. `index.html` disajikan `location /` di paling bawah, yang
    # tidak memakai `add_header` sama sekali — sehingga dokumennya tetap
    # mendapat header ini.
    #
    # Bila kelak ada `add_header` ditambahkan pada `location /`, baris CSP
    # ini HARUS ikut disalin ke sana.
    # -----------------------------------------------------------------------

    # -----------------------------------------------------------------------
    # Tipe MIME untuk `.mjs`.
    #
    # `mime.types` bawaan nginx 1.24 tidak mengenal akhiran `.mjs` sama
    # sekali; pemetaannya baru ditambahkan pada versi setelahnya. Akhiran yang
    # tidak dikenal jatuh ke `default_type`, yang pada `nginx.conf` bawaan
    # Ubuntu bernilai `application/octet-stream` — dan peramban MENOLAK
    # memuatnya sebagai modul:
    #
    #   Failed to load module script: The server responded with a
    #   non-JavaScript MIME type of "application/octet-stream".
    #
    # Yang terkena `assets/pdf.worker.min.mjs`, sehingga halaman PDF gagal
    # memuat worker-nya dan setiap unggahan PDF berhenti di situ.
    #
    # Baris `include` HARUS ikut ditulis. Blok `types` pada suatu level
    # MENGGANTIKAN pemetaan yang diwarisi, bukan menambahinya — tanpa include,
    # seluruh tipe lain (css, gambar, huruf) ikut jatuh ke
    # `application/octet-stream`, dan yang rusak bukan lagi halaman PDF saja
    # melainkan seluruh situs.
    #
    # Diperbaiki di sini, bukan di `/etc/nginx/mime.types`: berkas itu milik
    # paket nginx dan tertimpa kembali pada pemutakhiran berikutnya.
    # -----------------------------------------------------------------------
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # -----------------------------------------------------------------------
    # Berkas aplikasi yang sudah tidak ada dijawab 404, BUKAN index.html.
    #
    # Nama berkas mengikuti hash isinya, sehingga setiap build menghasilkan
    # nama berbeda. Tab yang terbuka sejak sebelum deploy masih menyimpan
    # daftar nama lama, dan begitu penggunanya membuka layar yang belum pernah
    # dimuat, berkas yang dicari sudah tidak ada.
    #
    # Tanpa blok ini, `try_files ... /index.html` di bawah menjawabnya dengan
    # halaman HTML, dan peramban menolaknya:
    #
    #   Failed to load module script: Expected a JavaScript-or-Wasm module
    #   script but the server responded with a MIME type of "text/html".
    #
    # Pesan itu tidak menyebut sebabnya sama sekali. Dengan 404, aplikasi
    # mengenalinya dan memuat ulang halaman sendiri.
    #
    # Ditaruh SEBELUM `location /` — nginx mendahulukan pencocokan regex atas
    # awalan, tetapi urutan penulisannya tetap dijaga agar terbaca sebagaimana
    # ia bekerja.
    #
    # CATATAN: berkas `.mjs` di bawah `/assets/` TIDAK ditangani blok ini.
    # `^~ /assets/` adalah awalan berpenanda, dan nginx mendahulukannya atas
    # regex — termasuk `pdf.worker.min.mjs`. Karena itu tipe MIME-nya diurus
    # di tingkat server di atas, bukan di sini.
    # -----------------------------------------------------------------------
    location ~* \.(js|mjs|css|map)$ {
        try_files $uri =404;

        # Aman disimpan lama: namanya berubah setiap kali isinya berubah,
        # sehingga tidak pernah ada versi basi yang tersaji.
        # `immutable` tidak dipancarkan `expires`, jadi di sini `add_header`
        # memang diperlukan — dan `expires` dihilangkan supaya headernya
        # tunggal. `max-age` ditulis langsung di dalamnya.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # -----------------------------------------------------------------------
    # Berkas ISI yang namanya TIDAK berhash.
    #
    # Terjemahan (`assets/i18n/id.json`) dan panduan (`assets/panduan/`)
    # bernama sama pada setiap build, sehingga peramban menyajikan salinan
    # lamanya walaupun aplikasinya sudah baru.
    #
    # Akibatnya berbeda-beda dan tidak ada yang menyebut sebabnya:
    #
    # - terjemahan basi  -> kunci tampil mentah, `hrQuestion.judul`
    # - `index.json` basi -> topik panduan baru tidak dikenali, dan panelnya
    #   terbuka di daftar topik alih-alih di halaman yang sedang dibuka
    #
    # `Ctrl+Shift+R` kerap tidak menyentuhnya karena keduanya dimuat lewat
    # XHR, bukan sebagai bagian halaman.
    #
    # Ditaruh SEBELUM aturan `/assets/` di bawah — nginx memilih awalan
    # terpanjang, sehingga keduanya menang atas aturan umum itu.
    # -----------------------------------------------------------------------
    location ^~ /assets/i18n/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ^~ /assets/panduan/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # -----------------------------------------------------------------------
    # WORKER pdf.js — TIDAK BERHASH, jadi tidak boleh disinggahi lama.
    # -----------------------------------------------------------------------
    #
    # `pdf-worker-shim.mjs` dan `pdf.worker.min.mjs` disalin apa adanya dari
    # paketnya; namanya tetap sama pada tiap build. Dengan `expires 30d` dari
    # aturan `/assets/` di bawah, peramban yang sudah pernah membuka halaman
    # PDF terus memakai worker LAMA sesudah paketnya dinaikkan:
    #
    #   The API version "6.3.289" does not match the Worker version "5.6.205".
    #
    # `Ctrl+Shift+R` kerap tidak menolong — worker-nya tidak dimuat sebagai
    # bagian halaman, melainkan lewat `import()` saat berjalan.
    #
    # `location =` (COCOK PERSIS), bukan regex: nginx mendahulukan `^~
    # /assets/` di bawah atas seluruh location beregex, sehingga aturan
    # beregex tidak akan pernah terpakai di sini. Yang berprioritas lebih
    # tinggi daripada `^~` hanyalah `=`.
    #
    # Berkas worker milik `ngx-extended-pdf-viewer` TIDAK ikut: namanya
    # sudah memuat versinya (`pdf.worker-6.2.1099.mjs`), jadi aman
    # disinggahi lama.
    location = /assets/pdf-worker-shim.mjs {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /assets/pdf.worker.min.mjs {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # -----------------------------------------------------------------------
    # Aset lain yang berhash: gambar, huruf, ikon.
    #
    # Dipisahkan dari i18n di atas karena namanya memang berubah tiap build.
    # -----------------------------------------------------------------------
    location ^~ /assets/ {
        # `expires` sudah memancarkan `Cache-Control: max-age=...` sendiri;
        # `add_header Cache-Control "public"` di sampingnya hanya menambah
        # baris kedua yang tidak mengubah perilaku apa pun.
        expires 30d;
    }

    # -----------------------------------------------------------------------
    # `index.html` TIDAK BOLEH disinggahi.
    #
    # Ia satu-satunya berkas yang namanya tidak berhash, dan isinya menunjuk
    # nama chunk yang berhash. Ketika build baru terbit, chunk lama dihapus
    # dari server — tetapi peramban yang menyinggah `index.html` masih
    # memintanya, mendapat 404, lalu berhenti di tengah pemuatan.
    #
    # Gejalanya: halaman macet setelah menekan pembaruan, dan baru pulih
    # setelah `Ctrl+Shift+R`. Tidak ada galat di server — dari sisinya,
    # permintaan chunk yang sudah dihapus memang wajar dijawab 404.
    #
    # Ditaruh SEBELUM `location /` di bawah: nginx memilih pencocokan berkas
    # yang lebih spesifik lebih dulu.
    # -----------------------------------------------------------------------
    location = /index.html {
        # `expires -1` SAJA, tanpa `add_header`.
        #
        # Keduanya bersama menghasilkan DUA baris `Cache-Control` pada satu
        # jawaban — `expires` memancarkan headernya sendiri. Peramban memang
        # memakai yang pertama, tetapi jawaban berheader ganda menyulitkan
        # siapa pun yang kelak menelusuri masalah singgahan: tidak jelas mana
        # yang berlaku, dan mana yang datang dari mana.
        #
        # `expires -1` sudah menghasilkan `no-cache` beserta `Expires` di masa
        # lalu — itu cukup untuk memaksa peramban bertanya ulang setiap kali.
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/terrabot.alphakonstruksi.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/terrabot.alphakonstruksi.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name services.terrabot.alphakonstruksi.id;
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:7500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/terrabot.alphakonstruksi.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/terrabot.alphakonstruksi.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = terrabot.alphakonstruksi.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name terrabot.alphakonstruksi.id;
    return 404; # managed by Certbot
}

server {
    if ($host = services.terrabot.alphakonstruksi.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name services.terrabot.alphakonstruksi.id;
    return 404; # managed by Certbot
}
