# TerraBot — konfigurasi nginx.
#
# Hanya blok server FRONTEND yang bertambah; blok API, pengalihan HTTP, dan
# seluruh baris Certbot dibiarkan persis seperti aslinya.
#
# Cadangkan dulu sebelum menimpa:
#   sudo cp /etc/nginx/sites-enabled/terrabot ~/terrabot-nginx-backup.conf
#
# Setelah menimpa:
#   sudo nginx -t          # HARUS lolos sebelum reload
#   sudo systemctl reload nginx
#
# Bila `nginx -t` gagal, JANGAN reload — kembalikan cadangannya. Nginx yang
# sedang berjalan tidak terpengaruh sampai reload, sehingga situsnya tetap
# hidup selama pemeriksaan belum lolos.

server {
    server_name terrabot.alphakonstruksi.id;
    root /var/www/terrabot/frontend;
    index index.html;

    # -----------------------------------------------------------------------
    # Tipe MIME untuk `.mjs`.
    #
    # `mime.types` bawaan nginx 1.24 tidak mengenal akhiran `.mjs` sama
    # sekali; pemetaannya baru ditambahkan pada versi setelahnya. Akhiran yang
    # tidak dikenal jatuh ke `default_type`, yang pada `nginx.conf` bawaan
    # Ubuntu bernilai `application/octet-stream` — dan peramban MENOLAK
    # memuatnya sebagai modul:
    #
    #   Failed to load module script: The server responded with a
    #   non-JavaScript MIME type of "application/octet-stream".
    #
    # Yang terkena `assets/pdf.worker.min.mjs`, sehingga halaman PDF gagal
    # memuat worker-nya dan setiap unggahan PDF berhenti di situ.
    #
    # Baris `include` HARUS ikut ditulis. Blok `types` pada suatu level
    # MENGGANTIKAN pemetaan yang diwarisi, bukan menambahinya — tanpa include,
    # seluruh tipe lain (css, gambar, huruf) ikut jatuh ke
    # `application/octet-stream`, dan yang rusak bukan lagi halaman PDF saja
    # melainkan seluruh situs.
    #
    # Diperbaiki di sini, bukan di `/etc/nginx/mime.types`: berkas itu milik
    # paket nginx dan tertimpa kembali pada pemutakhiran berikutnya.
    # -----------------------------------------------------------------------
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # -----------------------------------------------------------------------
    # Berkas aplikasi yang sudah tidak ada dijawab 404, BUKAN index.html.
    #
    # Nama berkas mengikuti hash isinya, sehingga setiap build menghasilkan
    # nama berbeda. Tab yang terbuka sejak sebelum deploy masih menyimpan
    # daftar nama lama, dan begitu penggunanya membuka layar yang belum pernah
    # dimuat, berkas yang dicari sudah tidak ada.
    #
    # Tanpa blok ini, `try_files ... /index.html` di bawah menjawabnya dengan
    # halaman HTML, dan peramban menolaknya:
    #
    #   Failed to load module script: Expected a JavaScript-or-Wasm module
    #   script but the server responded with a MIME type of "text/html".
    #
    # Pesan itu tidak menyebut sebabnya sama sekali. Dengan 404, aplikasi
    # mengenalinya dan memuat ulang halaman sendiri.
    #
    # Ditaruh SEBELUM `location /` — nginx mendahulukan pencocokan regex atas
    # awalan, tetapi urutan penulisannya tetap dijaga agar terbaca sebagaimana
    # ia bekerja.
    #
    # CATATAN: berkas `.mjs` di bawah `/assets/` TIDAK ditangani blok ini.
    # `^~ /assets/` adalah awalan berpenanda, dan nginx mendahulukannya atas
    # regex — termasuk `pdf.worker.min.mjs`. Karena itu tipe MIME-nya diurus
    # di tingkat server di atas, bukan di sini.
    # -----------------------------------------------------------------------
    location ~* \.(js|mjs|css|map)$ {
        try_files $uri =404;

        # Aman disimpan lama: namanya berubah setiap kali isinya berubah,
        # sehingga tidak pernah ada versi basi yang tersaji.
        # `immutable` tidak dipancarkan `expires`, jadi di sini `add_header`
        # memang diperlukan — dan `expires` dihilangkan supaya headernya
        # tunggal. `max-age` ditulis langsung di dalamnya.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # -----------------------------------------------------------------------
    # Berkas ISI yang namanya TIDAK berhash.
    #
    # Terjemahan (`assets/i18n/id.json`) dan panduan (`assets/panduan/`)
    # bernama sama pada setiap build, sehingga peramban menyajikan salinan
    # lamanya walaupun aplikasinya sudah baru.
    #
    # Akibatnya berbeda-beda dan tidak ada yang menyebut sebabnya:
    #
    # - terjemahan basi  -> kunci tampil mentah, `hrQuestion.judul`
    # - `index.json` basi -> topik panduan baru tidak dikenali, dan panelnya
    #   terbuka di daftar topik alih-alih di halaman yang sedang dibuka
    #
    # `Ctrl+Shift+R` kerap tidak menyentuhnya karena keduanya dimuat lewat
    # XHR, bukan sebagai bagian halaman.
    #
    # Ditaruh SEBELUM aturan `/assets/` di bawah — nginx memilih awalan
    # terpanjang, sehingga keduanya menang atas aturan umum itu.
    # -----------------------------------------------------------------------
    location ^~ /assets/i18n/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ^~ /assets/panduan/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # -----------------------------------------------------------------------
    # Aset lain yang berhash: gambar, huruf, ikon.
    #
    # Dipisahkan dari i18n di atas karena namanya memang berubah tiap build.
    # -----------------------------------------------------------------------
    location ^~ /assets/ {
        # `expires` sudah memancarkan `Cache-Control: max-age=...` sendiri;
        # `add_header Cache-Control "public"` di sampingnya hanya menambah
        # baris kedua yang tidak mengubah perilaku apa pun.
        expires 30d;
    }

    # -----------------------------------------------------------------------
    # `index.html` TIDAK BOLEH disinggahi.
    #
    # Ia satu-satunya berkas yang namanya tidak berhash, dan isinya menunjuk
    # nama chunk yang berhash. Ketika build baru terbit, chunk lama dihapus
    # dari server — tetapi peramban yang menyinggah `index.html` masih
    # memintanya, mendapat 404, lalu berhenti di tengah pemuatan.
    #
    # Gejalanya: halaman macet setelah menekan pembaruan, dan baru pulih
    # setelah `Ctrl+Shift+R`. Tidak ada galat di server — dari sisinya,
    # permintaan chunk yang sudah dihapus memang wajar dijawab 404.
    #
    # Ditaruh SEBELUM `location /` di bawah: nginx memilih pencocokan berkas
    # yang lebih spesifik lebih dulu.
    # -----------------------------------------------------------------------
    location = /index.html {
        # `expires -1` SAJA, tanpa `add_header`.
        #
        # Keduanya bersama menghasilkan DUA baris `Cache-Control` pada satu
        # jawaban — `expires` memancarkan headernya sendiri. Peramban memang
        # memakai yang pertama, tetapi jawaban berheader ganda menyulitkan
        # siapa pun yang kelak menelusuri masalah singgahan: tidak jelas mana
        # yang berlaku, dan mana yang datang dari mana.
        #
        # `expires -1` sudah menghasilkan `no-cache` beserta `Expires` di masa
        # lalu — itu cukup untuk memaksa peramban bertanya ulang setiap kali.
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/terrabot.alphakonstruksi.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/terrabot.alphakonstruksi.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name services.terrabot.alphakonstruksi.id;
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:7500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/terrabot.alphakonstruksi.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/terrabot.alphakonstruksi.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = terrabot.alphakonstruksi.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name terrabot.alphakonstruksi.id;
    return 404; # managed by Certbot
}

server {
    if ($host = services.terrabot.alphakonstruksi.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name services.terrabot.alphakonstruksi.id;
    return 404; # managed by Certbot
}
